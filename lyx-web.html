<style>
:root {
  --chrome: #ecebe8; --chrome-2: #e2e0dc; --chrome-line: #bdbab4; --chrome-text: #1d1d1b; --chrome-muted: #77746e;
  --hover: #d6dfee; --sel: #2f5ea8; --sel-text: #fff;

  --special: #1b45b3; --depth: #c9bba6; --menu-bg: #fbfbfa; --dlg-bg: #f6f5f2; --field: #fff;

  --zoom: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #2b2b2a; --chrome-2: #333331; --chrome-line: #4a4946; --chrome-text: #e7e5e0; --chrome-muted: #9c9992;
    --hover: #3a4559; --sel: #4b74c2; --paper: #23221f; --text: #ece9e2; --math: #8fb3ff; --ert: #ff8a80; --ert-line: #7a3a36;
    --inset-line: #77736b; --inset-label: #a8a49b; --note-bg: #3b3820; --note-line: #807530; --special: #8fb3ff; --depth: #5a5348;
    --menu-bg: #2f2f2d; --dlg-bg: #2c2c2a; --field: #1d1d1c;
  }
}
:root[data-theme="dark"] {
  --chrome: #2b2b2a; --chrome-2: #333331; --chrome-line: #4a4946; --chrome-text: #e7e5e0; --chrome-muted: #9c9992;
  --hover: #3a4559; --sel: #4b74c2; --paper: #23221f; --text: #ece9e2; --math: #8fb3ff; --ert: #ff8a80; --ert-line: #7a3a36;
  --inset-line: #77736b; --inset-label: #a8a49b; --note-bg: #3b3820; --note-line: #807530; --special: #8fb3ff; --depth: #5a5348;
  --menu-bg: #2f2f2d; --dlg-bg: #2c2c2a; --field: #1d1d1c;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.35 var(--ui); color: var(--chrome-text); background: var(--chrome); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* Menubar */

.menubar .mtop:hover, .menubar .mtop.open { background: var(--hover); }

/* Toolbars */
.toolbars { flex-shrink: 0; background: var(--chrome); border-bottom: 1px solid var(--chrome-line); }

.tb + .tb { border-top: 1px solid var(--chrome-2); }

:root[data-theme="dark"] .tbtn { color: #9db8e8; }

.tbtn.on { border-color: var(--chrome-line); background: var(--hover); }

.tbtn .txt { font: 600 12px var(--serif); }
#layoutCombo { height: 24px; width: 168px; border: 1px solid var(--chrome-line); background: var(--field); border-radius: 2px; margin-right: 4px; padding: 0 4px; }
#layoutCombo optgroup { font-style: normal; color: var(--chrome-muted); font-size: 11px; }
#layoutCombo option { color: var(--chrome-text); font-size: 13px; }

/* Find bar */
.findbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); flex-wrap: wrap; }
.findbar[hidden] { display: none; }
.findbar input[type=text] { height: 24px; border: 1px solid var(--chrome-line); background: var(--field); padding: 0 6px; width: 200px; border-radius: 2px; }
.findbar button, .dlg-buttons button, .pane-head button, .mini-btn { height: 24px; padding: 0 10px; border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 3px; cursor: default; }
.findbar button:hover, .dlg-buttons button:hover { background: var(--hover); }
.findbar label { display: inline-flex; align-items: center; gap: 3px; }

/* Workspace */
.workspace { flex: 1; display: flex; min-height: 0; }
.pane { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--chrome); border-right: 1px solid var(--chrome-line); min-height: 0; }

.pane-head .x { margin-left: auto; width: 22px; padding: 0; }
.pane-head select { height: 22px; border: 1px solid var(--chrome-line); background: var(--field); font-weight: 400; flex: 1; min-width: 0; }
#outline { overflow: auto; flex: 1; padding: 4px 0; background: var(--field); }
#outline .oi { padding: 2px 8px; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#outline .oi:hover { background: var(--hover); }
#outline .oi.l2 { padding-left: 22px; } #outline .oi.l3 { padding-left: 36px; } #outline .oi.l4, #outline .oi.l5 { padding-left: 50px; }
#outline .empty { color: var(--chrome-muted); padding: 8px; }
#source { margin: 0; flex: 1; overflow: auto; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; background: var(--field); user-select: text; }
.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tabbar { display: flex; background: var(--chrome); border-bottom: 1px solid var(--chrome-line); padding: 3px 4px 0; flex-shrink: 0; }
.tab { padding: 3px 12px; border: 1px solid var(--chrome-line); border-bottom: 0; background: var(--paper); border-radius: 3px 3px 0 0; margin-bottom: -1px; white-space: nowrap; color: var(--text); }
#workarea { flex: 1; overflow: auto; background: var(--paper); position: relative; }

/* Document */
#editor { outline: none; min-height: 100%; padding: 22px 34px 40vh 34px; color: var(--text); font-family: var(--serif); font-size: calc(17px * var(--zoom)); line-height: 1.55; caret-color: var(--text); }
.blk { position: relative; margin: 0 0 .55em; white-space: pre-wrap; overflow-wrap: break-word; min-height: 1.55em;
  margin-left: calc(var(--depth, 0) * 1.6em); }
.blk[data-depth]::after { content: ""; position: absolute; top: 0; bottom: -.55em; left: calc(var(--depth, 0) * -1.6em); width: calc(var(--depth, 0) * 1.6em);
  background: repeating-linear-gradient(to right, transparent 0 .55em, var(--depth) .55em calc(.55em + 1px), transparent calc(.55em + 1px) 1.6em); pointer-events: none; }
.blk::before { content: attr(data-num); }
.blk[data-indent] { text-indent: 1.6em; }
.blk[data-align="center"] { text-align: center; } .blk[data-align="right"] { text-align: right; } .blk[data-align="left"] { text-align: left; } .blk[data-align="block"] { text-align: justify; }
.blk[data-type="Title"] { font: 700 calc(27px * var(--zoom))/1.3 var(--sans); text-align: center; margin: .4em 0 .5em; }
.blk[data-type="Author"] { font-style: italic; text-align: center; font-size: calc(19px * var(--zoom)); }
.blk[data-type="Date"] { text-align: center; }
.blk[data-type="Abstract"] { margin-left: 2.5em; margin-right: 2.5em; font-size: .94em; }
.blk[data-type="Abstract"]::before { font-weight: 700; }
.blk[data-type^="Part"] { font-size: 1.75em; font-weight: 700; margin: 1em 0 .6em; }
.blk[data-type^="Section"] { font-size: 1.42em; font-weight: 700; margin: 1em 0 .45em; line-height: 1.3; }
.blk[data-type^="Subsection"] { font-size: 1.2em; font-weight: 700; margin: .9em 0 .4em; line-height: 1.3; }
.blk[data-type^="Subsubsection"] { font-size: 1.05em; font-weight: 700; margin: .8em 0 .35em; }
.blk[data-type^="Paragraph"], .blk[data-type^="Subparagraph"] { font-weight: 700; margin-top: .6em; }
.blk[data-type="Section"]::before, .blk[data-type="Subsection"]::before, .blk[data-type="Subsubsection"]::before { display: inline-block; min-width: 1.6em; padding-right: .6em; }
.blk[data-type="Part"]::before { display: block; }
.blk[data-type="Quote"], .blk[data-type="Quotation"], .blk[data-type="Verse"] { margin-left: calc(var(--depth, 0) * 1.6em + 2.2em); margin-right: 2.2em; }
.blk[data-type="Quotation"] { text-indent: 1.5em; }
.blk[data-type="Verse"] { padding-left: 1.5em; text-indent: -1.5em; }
.blk[data-type="LyX-Code"] { font-family: var(--mono); font-size: .88em; margin-left: calc(var(--depth, 0) * 1.6em + 1.6em); margin-bottom: 0; }
.blk[data-type="Itemize"], .blk[data-type="Enumerate"], .blk[data-type="Description"] { padding-left: 1.9em; margin-bottom: .25em; }
.blk[data-type="Itemize"]::before, .blk[data-type="Enumerate"]::before { position: absolute; left: 0; width: 1.6em; text-align: right; }
.blk[data-type="Description"] { padding-left: 1.9em; text-indent: -1.9em; }
.blk.thm-plain { font-style: italic; }
.blk.thm-plain::before, .blk.thm-definition::before { font-weight: 700; font-style: normal; }
.blk.thm-remark::before, .blk.thm-proof::before { font-style: italic; }
.blk[data-num]:not([data-num=""])::before { margin-right: .45em; }
.blk[data-type$="*"]::before { content: none; }
.blk[data-cont]::before { content: none; }
.blk[data-cont] { text-indent: 0; }
.blk[data-appendix]::after { content: "Appendix"; position: absolute; left: -32px; top: -1.1em; font: 10px var(--ui); color: var(--ert); background: none; width: auto; }
.blk.unknown-layout { outline: 1px dashed var(--inset-line); outline-offset: 2px; }

/* Display math */
.blk[data-type="_display"] { display: flex; justify-content: center; align-items: center; padding: .25em 3.5em; white-space: normal; }
.blk[data-type="_display"].in-plain { font-style: italic; }
.blk[data-type="_display"] .eqno { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-style: normal; }
.blk[data-type="_display"] .eqlabel { position: absolute; right: 0; bottom: -.4em; font: 10px var(--ui); color: var(--inset-label); }
.blk[data-type="_display"]::before { content: none; }

/* Math */
math-field { border: 0; background: transparent; color: var(--math); font-size: 1em; padding: 0; --caret-color: var(--math); --primary: var(--math);
  --selection-background-color: rgba(47,94,168,.22); --contains-highlight-background-color: rgba(47,94,168,.08); --placeholder-color: var(--math); }
math-field::part(menu-toggle), math-field::part(virtual-keyboard-toggle) { display: none; }
math-field:focus-within { outline: none; }
math-field:not(:defined) { font: .8em var(--mono); }
.mwrap { display: inline-block; text-indent: 0; }
math-field.inline { display: inline-block; vertical-align: -0.2em; min-width: .7em; border-radius: 1px; }
math-field.inline::part(container) { padding: 0; }
math-field.inline::part(content) { padding: 0 1px; }
math-field.inline:focus-within { box-shadow: 0 0 0 1px var(--math); }
math-field.display { font-size: 1.12em; min-width: 3em; padding: 2px 6px; border-radius: 1px; }
math-field.display:focus-within { box-shadow: 0 0 0 1px var(--math); }

/* Insets */
.inset { display: inline; border: 1px solid var(--inset-line); border-radius: 2px; padding: 0 3px; margin: 0 1px; text-indent: 0; font-style: normal; font-weight: 400; }
.ilabel { font: 11px var(--ui); color: var(--inset-label); margin-right: 4px; cursor: pointer; user-select: none; }
.ibody { outline: none; }
.inset.collapsed .ibody { display: none; }
.inset.collapsed .ilabel { margin-right: 0; }
.inset[data-inset="ERT"] { border-color: var(--ert-line); color: var(--ert); font: .88em var(--mono); white-space: pre-wrap; padding: 1px 4px; }
.inset[data-inset="ERT"]:not(.collapsed) .ilabel { display: none; }
.inset[data-inset="ERT"] .ilabel { color: var(--ert); }
.inset[data-inset="Note"] { background: var(--note-bg); border-color: var(--note-line); }
.inset[data-inset="Note"][data-note="Comment"] { background: transparent; border-style: dashed; }
.inset[data-inset="Note"][data-note="Greyedout"] { background: transparent; color: var(--chrome-muted); }
.inset[data-inset="Foot"], .inset[data-inset="Marginal"] { font-size: .9em; }
.inset[data-inset="URL"] { font: .9em var(--mono); color: var(--special); }
.atom { font: 12px var(--ui); color: var(--inset-label); padding: 0 4px; cursor: default; white-space: nowrap; }
.atom[data-inset="Ref"] { color: var(--special); }
.atom.raw { color: var(--ert); border-style: dashed; }
.sc { color: var(--special); }
.sc[data-sc="protected"], .sc[data-sc="thin"], .sc[data-sc="normal"] { border-bottom: 1px solid var(--special); }
.lb { color: #d0469a; font-size: .85em; }
em { font-style: italic; } .blk.thm-plain em { font-style: normal; }
.ftt { font-family: var(--mono); font-size: .9em; } .fsf { font-family: var(--sans); } .frm { font-family: var(--serif); }
.noun { font-variant: small-caps; }
.uuline { text-decoration: underline double; } .uwave { text-decoration: underline wavy; }
.sz-tiny { font-size: .55em; } .sz-scriptsize { font-size: .7em; } .sz-footnotesize { font-size: .8em; } .sz-small { font-size: .9em; }
.sz-large { font-size: 1.2em; } .sz-larger { font-size: 1.44em; } .sz-largest { font-size: 1.73em; } .sz-huge { font-size: 2.07em; } .sz-giant { font-size: 2.49em; }
.blk[data-type="_toc"], .blk[data-type="_newpage"], .blk[data-type="_line"] { white-space: normal; user-select: none; }
.blk[data-type="_toc"] { border: 1px solid var(--inset-line); padding: 6px 10px; font-size: .9em; }
.blk[data-type="_toc"] .toch { font: 600 12px var(--ui); color: var(--inset-label); margin-bottom: 4px; }
.blk[data-type="_newpage"] { text-align: center; font: 11px var(--ui); color: var(--special); border-top: 1px dashed var(--special); padding-top: 2px; }
.blk[data-type="_line"] { height: 1.2em; } .blk[data-type="_line"] hr { border: 0; border-top: 1px solid var(--text); margin: .55em 0 0; }
::highlight(lyxfind) { background: #ffd54a; color: #000; }

/* Math toolbars */
.mathbars { flex-shrink: 0; background: var(--chrome); border-top: 1px solid var(--chrome-line); }
.mathbars[hidden] { display: none; }
.mathbars .tbtn { width: auto; min-width: 28px; padding: 0 4px; color: var(--chrome-text); font: 16px var(--serif); }
.mathbars .tbtn.small { font: 12px var(--ui); }

/* Status bar */
.statusbar { flex-shrink: 0; display: flex; align-items: center; gap: 10px; height: 22px; padding: 0 6px; border-top: 1px solid var(--chrome-line); background: var(--chrome); font-size: 12px; }
#status { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#minibuf { flex: 1; height: 18px; border: 1px solid var(--chrome-line); background: var(--field); padding: 0 4px; font: 12px var(--mono); }
#minibuf[hidden] { display: none; }
#statusRight { color: var(--chrome-muted); white-space: nowrap; }

/* Menus */
#menuLayer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.menu { position: fixed; pointer-events: auto; background: var(--menu-bg); border: 1px solid #8f8c86; box-shadow: 2px 3px 8px rgba(0,0,0,.22); padding: 2px 0; min-width: 190px; max-height: calc(100vh - 40px); overflow-y: auto; user-select: none; }
.mi { display: flex; align-items: center; gap: 18px; padding: 3px 12px 3px 26px; white-space: nowrap; cursor: default; position: relative; }
.mi .sc-key { margin-left: auto; color: var(--chrome-muted); font-size: 12px; }
.mi .arrow { margin-left: auto; font-size: 10px; }
.mi .check { position: absolute; left: 8px; }
.mi.hl { background: var(--sel); color: var(--sel-text); }
.mi.hl .sc-key { color: var(--sel-text); }
.mi.dis { color: var(--chrome-muted); opacity: .62; }
.mi.dis.hl { background: var(--chrome-2); color: var(--chrome-muted); }
.msep { height: 1px; background: var(--chrome-line); margin: 3px 2px; }

/* Dialogs */
dialog#dlg { border: 1px solid #8f8c86; padding: 0; background: var(--dlg-bg); color: var(--chrome-text); min-width: 340px; max-width: min(720px, 94vw); box-shadow: 3px 5px 18px rgba(0,0,0,.3); }
dialog#dlg::backdrop { background: rgba(0,0,0,.15); }
.dlg-title { padding: 6px 10px; background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); font-weight: 600; }
.dlg-body { padding: 12px; max-height: 70vh; overflow: auto; }
.dlg-body label.row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
.dlg-body input[type=text], .dlg-body input[type=number], .dlg-body select, .dlg-body textarea { border: 1px solid var(--chrome-line); background: var(--field); padding: 3px 5px; border-radius: 2px; width: 100%; }
.dlg-body textarea { font: 12px var(--mono); min-height: 110px; }
.dlg-body fieldset { border: 1px solid var(--chrome-line); margin: 0 0 10px; padding: 6px 10px; }
.dlg-body table { border-collapse: collapse; width: 100%; font-size: 12px; }
.dlg-body td, .dlg-body th { border-bottom: 1px solid var(--chrome-2); padding: 3px 6px; text-align: left; vertical-align: top; }
.dlg-body td.k { white-space: nowrap; font-family: var(--mono); }
.dlg-body td.na { color: var(--chrome-muted); }
.dlg-body .lst { width: 100%; min-height: 160px; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--chrome-line); }
.dlg-buttons button.def { font-weight: 600; }

@media (max-width: 760px) {
  .pane { display: none !important; }
  #editor { padding: 14px 16px 40vh; }
  #layoutCombo { width: 130px; }
}
@media print {
  .menubar, .toolbars, .tabbar, .pane, .mathbars, .statusbar, .findbar { display: none !important; }
  html, body, #app, .workspace, .center, #workarea { height: auto; overflow: visible; background: #fff; }
  #editor { padding: 0; color: #000; }
  .blk[data-depth]::after { display: none; }
  .inset[data-inset="Note"] { display: none; }
  math-field { color: #000; }
}
</style>

<div id="app">
  <div class="menubar" id="menubar" role="menubar"></div>

  <div class="toolbars" id="toolbars">
    <div class="tb" id="tbStandard">
      <span class="grip"></span>
      <select id="layoutCombo" title="Paragraph layout (Alt+P, Space)"></select>

      <button class="tbtn" data-lfun="math-mode"><i class="ti ti-sum"></i></button>

      <button class="tbtn" data-lfun="tabular-insert"><i class="ti ti-table"></i></button>
      <span class="sep"></span>
      <button class="tbtn" data-lfun="dialog-toggle toc" data-toggle="1"><i class="ti ti-list-tree"></i></button>

  document: documentSettings, prefs: preferencesDialog, aboutlyx: aboutDialog, mathdelimiter: delimiterDialog, mathmatrix: matrixDialog,

function isImplemented(lf) {
  lf = lf.trim();
  if (lf.startsWith('command-sequence')) return lf.slice(16).split(';').map(s => s.trim()).filter(Boolean).every(isImplemented);
  if (lf.startsWith('command-alternatives')) return lf.slice(20).split(';').map(s => s.trim()).filter(Boolean).some(isImplemented);
  const name = lfunName(lf), arg = lfunArg(lf);
  if (name === 'dialog-show') return !!DIALOGS[arg];
  if (NATIVE.has(name) && !H[name]) return true;
  return !!H[name];
}
function isEnabled(lf) {
  lf = lf.trim();
  if (lf.startsWith('command-sequence')) { const parts = lf.slice(16).split(';').map(s => s.trim()).filter(Boolean); return parts.length > 0 && parts.every(isImplemented) && isEnabled(parts[0]); }
  if (lf.startsWith('command-alternatives')) return lf.slice(20).split(';').map(s => s.trim()).filter(Boolean).some(isEnabled);
  if (SPECIAL_EN[lf]) return SPECIAL_EN[lf]();
  const name = lfunName(lf), arg = lfunArg(lf);
  if (name === 'dialog-show') return !!DIALOGS[arg];
  const h = H[name];
  if (!h) return NATIVE.has(name);
  if (h.en) { try { return !!h.en(arg); } catch (e) { return false; } }
  return true;
}
function checked(lf) {
  switch (lf) {
    case 'dialog-toggle toc': return !$('#outlinePane').hidden;
    case 'dialog-toggle view-source': return !$('#sourcePane').hidden;
    case 'ui-toggle fullscreen': return !!document.fullscreenElement;
    case 'math-number-toggle': { const m = activeMath(); return !!(m && m.closest('.blk').dataset.numbered); }
    case 'toolbar-toggle math': return $('#mathbars').dataset.forced === '1';
    case 'toolbar-toggle standard': return !$('#tbStandard').hidden;
    case 'toolbar-toggle extra': return !$('#tbExtra').hidden;
    case 'dialog-show spellchecker': return ed.spellcheck;
  }
  if (lf.startsWith('layout ')) { const b = currentBlock(); return !!b && b.dataset.type === lf.slice(7); }
  return false;
}
function run(lf) {
  lf = lf.trim();
  if (lf.startsWith('command-sequence')) {
    const parts = lf.slice(16).split(';').map(s => s.trim()).filter(Boolean);
    for (const p of parts) run(p);
    return;
  }
  if (lf.startsWith('command-alternatives')) {
    const parts = lf.slice(20).split(';').map(s => s.trim()).filter(Boolean);
    const p = parts.find(isEnabled);
    if (p) run(p); else status('Command disabled');
    return;
  }
  if (!isImplemented(lf)) { status(lfunName(lf) && knownLyx(lf) ? `"${lf}" is not available in this web version.` : 'Unknown function.'); return; }
  if (!isEnabled(lf)) { status('Command disabled'); return; }
  const name = lfunName(lf), arg = lfunArg(lf);
  if (name === 'dialog-show') { DIALOGS[arg](); return; }
  const h = H[name];
  try { const r = h.run(arg); if (r && r.catch) r.catch(e => { console.error(e); status('Error: ' + e.message); }); }
  catch (e) { console.error(e); status('Error: ' + e.message); }
  setTimeout(() => { updateCombo(); updateToolbarState(); }, 0);
}
function knownLyx(lf) { return BINDS.some(b => lfunName(b.lfun) === lfunName(lf)) || ALL_MENU_LFUNS.has(lfunName(lf)); }

    if (!heads.length) return [{ label: '(No Table of Contents)', dis: true }];
    return heads.slice(0, 40).map(b => ({ label: '  '.repeat(Math.max(0, headLevel(b.dataset.type) - 1)) + ((b.dataset.num && !b.dataset.type.endsWith('*')) ? b.dataset.num.replace(/^Part /, '') + ' ' : '') + (plainText(b).slice(0, 50) || '(empty)'), fn: () => gotoBlock(b) }));

function menuItems(id) {
  const out = [];
  for (const it of MENUS[id] || []) {
    if (it[0] === '-') { if (out.length && out[out.length - 1].sep !== true) out.push({ sep: true }); continue; }
    if (it[0].startsWith('@')) { out.push(...dynamicItems(it[0].slice(1))); continue; }
    let label = it[0];
    const sub = label.startsWith('>'); if (sub) label = label.slice(1);
    const opt = label.startsWith('?'); if (opt) label = label.slice(1);
    if (sub) {
      const children = menuItems(it[1]);
      const any = children.some(c => !c.sep && !c.dis);
      if (opt && !any) continue;
      out.push({ label, sub: it[1], dis: false });
    } else {
      const en = isImplemented(it[1]) && isEnabled(it[1]);
      if (opt && !en) continue;
      out.push({ label, lfun: it[1], dis: !en, na: !isImplemented(it[1]), checked: checked(it[1]) });
    }
  }

    d.className = 'mi' + (it.dis ? ' dis' : '');
    d.dataset.idx = idx;
    const sc = it.lfun ? shortcutFor(it.lfun) : '';
    d.innerHTML = (it.checked ? '<span class="check">\u2713</span>' : '') + `<span>${mnLabel(it.label)}</span>` + (it.sub ? '<span class="arrow">\u25B6</span>' : sc ? `<span class="sc-key">${esc(sc)}</span>` : '');
    if (it.na) d.title = 'Not available in this web version';
    d.addEventListener('mouseenter', () => { highlight(level, idx); if (it.sub) openSub(level, idx); else closeSubsFrom(level + 1); });
    d.addEventListener('mousedown', e => e.preventDefault());
    d.addEventListener('click', () => activate(level, idx));
    m.append(d);
  });
  $('#menuLayer').append(m);
  const r = m.getBoundingClientRect();
  if (x + r.width > innerWidth - 4) x = Math.max(4, level ? x - r.width - (menuState.stack[level - 1] ? menuState.stack[level - 1].el.getBoundingClientRect().width : 0) + 4 : innerWidth - r.width - 4);

  menuState.open = true; menuState.top = i;
  const top = $$('#menubar .mtop')[i];
  $$('#menubar .mtop').forEach((t, k) => t.classList.toggle('open', k === i));
  const r = top.getBoundingClientRect();
  const items = menuItems(MENUBAR[i].id);
  const el = renderMenu(items, r.left, r.bottom, 0);
  menuState.stack = [{ el, items, hl: -1 }];
  if (kbd) moveHl(0, 1);
}
function openSub(level, idx) {
  closeSubsFrom(level + 1);
  const st = menuState.stack[level]; const it = st.items[idx];
  const row = st.el.querySelector(`.mi[data-idx="${idx}"]`);
  const r = row.getBoundingClientRect();
  const items = menuItems(it.sub);
  const el = renderMenu(items, r.right - 2, r.top - 3, level + 1);
  menuState.stack[level + 1] = { el, items, hl: -1 };
}
function closeSubsFrom(level) { while (menuState.stack.length > level) { const s = menuState.stack.pop(); s.el.remove(); } }
function closeMenus(keepFocus) {
  closeSubsFrom(0);
  menuState.open = false; menuState.top = -1;
  $$('#menubar .mtop').forEach(t => t.classList.remove('open'));
  document.body.classList.remove('show-mn');
  if (!keepFocus && !activeMath()) selRange(true);
}
function highlight(level, idx) {
  const st = menuState.stack[level]; if (!st) return;
  st.hl = idx;
  $$('.mi', st.el).forEach(r => r.classList.toggle('hl', +r.dataset.idx === idx));
  const row = st.el.querySelector(`.mi[data-idx="${idx}"]`); if (row) row.scrollIntoView({ block: 'nearest' });
}
function moveHl(level, dir) {
  const st = menuState.stack[level]; if (!st) return;
  const n = st.items.length; let i = st.hl;
  for (let k = 0; k < n; k++) { i = (i + dir + n) % n; if (!st.items[i].sep) { highlight(level, i); return; } }
}
function activate(level, idx) {
  const it = menuState.stack[level].items[idx];
  if (it.sub) { openSub(level, idx); moveHl(level + 1, 1); return; }
  if (it.dis) return;
  closeMenus(true);
  if (it.fn) { it.fn(); return; }
  if (!activeMath()) selRange(true);
  run(it.lfun);
}
function menuKey(e) {
  const lvl = menuState.stack.length - 1;
  const st = menuState.stack[lvl];
  const k = e.key;
  e.preventDefault(); e.stopPropagation();
  if (k === 'Escape') { if (lvl > 0) closeSubsFrom(lvl); else closeMenus(); return; }
  if (k === 'ArrowDown') { moveHl(lvl, 1); return; }
  if (k === 'ArrowUp') { moveHl(lvl, -1); return; }
  if (k === 'ArrowRight') { const it = st.items[st.hl]; if (it && it.sub) { openSub(lvl, st.hl); moveHl(lvl + 1, 1); } else openMenu((menuState.top + 1) % MENUBAR.length, true); return; }
  if (k === 'ArrowLeft') { if (lvl > 0) closeSubsFrom(lvl); else openMenu((menuState.top - 1 + MENUBAR.length) % MENUBAR.length, true); return; }
  if (k === 'Enter' || k === ' ') { if (st.hl >= 0) activate(lvl, st.hl); return; }
  if (k === 'Alt' || k === 'F10') { closeMenus(); return; }
  if (k.length === 1) {
    const ch = k.toLowerCase();
    const idx = st.items.findIndex(it => !it.sep && it.label.includes('|') && it.label.split('|')[1].toLowerCase() === ch);
    if (idx >= 0) { highlight(lvl, idx); activate(lvl, idx); return; }
    if (e.altKey) { const mi = MENUBAR.findIndex(m => m.key === ch); if (mi >= 0) openMenu(mi, true); }
  }
}
document.addEventListener('mousedown', e => {
  if (menuState.open && !e.target.closest('.menu') && !e.target.closest('#menubar')) closeMenus(true);
});
window.addEventListener('resize', () => { if (menuState.open) closeMenus(true); });

/* ---------- Toolbars ---------- */
function wireToolbars() {
  const names = { 'buffer-new': 'New', 'file-open': 'Open', 'buffer-write': 'Save', undo: 'Undo', redo: 'Redo', cut: 'Cut', copy: 'Copy', paste: 'Paste',
    'dialog-show findreplace': 'Find and replace', 'bookmark-goto 0': 'Navigate back', 'font-emph': 'Emphasize', 'font-noun': 'Noun', 'font-bold': 'Bold',
    'math-mode': 'Insert math', 'dialog-show-new-inset graphics': 'Insert graphics', 'tabular-insert': 'Insert table', 'dialog-toggle toc': 'Toggle outline pane',
    'dialog-toggle view-source': 'Toggle source pane', 'toolbar-toggle math': 'Always show the math toolbars', 'buffer-view': 'View (HTML preview)', 'buffer-update': 'Update',
    'layout Itemize': 'Itemize list', 'layout Enumerate': 'Enumerate list', 'depth-decrement': 'Decrease depth', 'depth-increment': 'Increase depth',
    'footnote-insert': 'Insert footnote', 'marginalnote-insert': 'Insert margin note', 'note-insert Note': 'Insert LyX note', 'label-insert': 'Insert label',
    'dialog-show-new-inset ref': 'Insert cross-reference', 'flex-insert URL': 'Insert URL', 'ert-insert': 'Insert TeX code',
    'paragraph-params \\align left': 'Align left', 'paragraph-params \\align center': 'Center', 'paragraph-params \\align right': 'Align right',
    'dialog-show spellchecker': 'Spellchecker', 'dialog-show document': 'Document settings' };
  $$('.tbtn[data-lfun], .pane-head button[data-lfun]').forEach(b => {
    const lf = b.dataset.lfun;
    const sc = shortcutFor(lf);
    if (b.classList.contains('tbtn')) b.title = (names[lf] || lf) + (sc ? ' (' + sc + ')' : '');
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { if (!activeMath()) selRange(true); run(lf); });
  });
}

/* =====================================================================
   Preferences, autosave, startup
   ===================================================================== */
function applyPrefs() {
  if (prefs.theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', prefs.theme);
  document.documentElement.style.setProperty('--zoom', prefs.zoom / 100);
  updateCombo();
}
function savePrefs() { try { localStorage.setItem('lyxweb-prefs', JSON.stringify(prefs)); } catch (e) {} }
function loadPrefs() { try { Object.assign(prefs, JSON.parse(localStorage.getItem('lyxweb-prefs') || '{}')); } catch (e) {} }
let autosaveTimer = null;
function scheduleAutosave() { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(autosave, 800); }
function autosave() {
  try { localStorage.setItem('lyxweb-autosave', JSON.stringify({ html: serialize(), fileName, settings: docSettings, dirty, newCount })); } catch (e) {}
}
function restoreAutosave() {
  try {
    const d = JSON.parse(localStorage.getItem('lyxweb-autosave') || 'null');
    if (!d || !d.html) return false;
    ed.innerHTML = d.html; hydrate();
    fileName = d.fileName || fileName; docSettings = d.settings || docSettings; dirty = !!d.dirty; newCount = d.newCount || newCount;
    return true;
  } catch (e) { return false; }
}
function sampleBlocks() {
  const M = l => mkMath(l);
  const ert = t => { const i = mkInset('ERT'); i.querySelector('.ibody').textContent = t; return i; };
  const foot = t => { const i = mkInset('Foot'); i.querySelector('.ibody').textContent = t; return i; };
  const em = t => { const e = document.createElement('em'); e.textContent = t; return e; };
  const kbd = t => { const s = document.createElement('span'); s.className = 'ftt'; s.textContent = t; return s; };
  const lab = n => mkAtom('Label', { name: n });
  const ref = (n, c) => mkAtom('Ref', { name: n, cmd: c || 'ref' });
  return [
    mkBlock('Title', 'A Short Note on Integrals'),
    mkBlock('Author', 'Your Name'),
    mkBlock('Abstract', 'This sample document shows what the editor can do: paragraph layouts, numbered theorems and equations, footnotes, cross-references and raw TeX code. Everything uses LyX\u2019s own keyboard shortcuts.'),
    mkBlock('Section', 'Introduction', lab('sec:intro')),
    mkBlock('Standard', 'Let ', M('f:[a,b]\\to\\mathbb{R}'), ' be continuous and let ', M('F'), ' be an antiderivative of ', M('f'), ', so that ', M("F'=f"), '.', foot('Click any formula to edit it. Arrow keys move in and out of formulas.'), ' Press ', kbd('Ctrl+M'), ' to start a new formula and ', kbd('Esc'), ' to leave it.'),
    mkBlock('Definition', 'A function ', M('F'), ' is an ', em('antiderivative'), ' of ', M('f'), ' on ', M('[a,b]'), ' if ', M("F'(x)=f(x)"), ' for every ', M('x\\in[a,b]'), '.'),
    mkBlock('Section', 'Main result'),
    mkBlock('Theorem', lab('thm:ftc'), 'If ', M('f'), ' is continuous on ', M('[a,b]'), ' and ', M('F'), ' is an antiderivative of ', M('f'), ', then'),
    mkDisplay('\\int_a^b f(x)\\,dx=F(b)-F(a)', true, '', 'eq:ftc'),
    mkBlock('Proof', 'This follows from the mean value theorem applied on a partition of ', M('[a,b]'), '.'),
    mkBlock('Standard', 'For example, Theorem ', ref('thm:ftc'), ' with ', M('f(x)=x^2'), ' gives ', M('\\int_0^1x^2\\,dx=\\frac{1}{3}'), ', using equation ', ref('eq:ftc', 'eqref'), '.'),
    mkBlock('Section', 'LyX shortcuts to try', lab('sec:keys')),
    mkBlock('Itemize', kbd('Alt+P'), ' then a key sets the paragraph layout: ', kbd('2'), ' Section, ', kbd('3'), ' Subsection, ', kbd('S'), ' Standard, ', kbd('I'), ' Itemize, ', kbd('E'), ' Enumerate.'),
    mkBlock('Itemize', kbd('Ctrl+M'), ' inline formula, ', kbd('Ctrl+Shift+M'), ' display formula, ', kbd('Ctrl+Alt+N'), ' numbered formula.'),
    mkBlock('Itemize', 'Inside a formula, ', kbd('Alt+M F'), ' makes a fraction, ', kbd('Alt+M S'), ' a square root, and ', kbd('Alt+M G A'), ' types ', M('\\alpha'), '. You can also type ', kbd('/'), ', ', kbd('^'), ' or ', kbd('\\alpha'), ' directly.'),
    mkBlock('Itemize', kbd('Ctrl+E'), ' emphasizes, ', kbd('Ctrl+B'), ' bolds, ', kbd('Ctrl+L'), ' inserts TeX code such as ', ert('\\LaTeX{}'), ', and ', kbd('Alt+Shift+\u2192'), ' nests a list deeper.'),
    mkBlock('Itemize', kbd('Alt+X'), ' opens the command buffer, where you can type any LyX function name.'),
    mkBlock('Standard', 'See Section ', ref('sec:intro'), ' for the setup. Use ', em('Help \u25B8 Shortcuts'), ' for the full list of key bindings.'),
  ];
}
function init() {
  loadBindings();
  loadPrefs();
  buildMenubar();
  buildLayoutCombo();
  buildMathbars();
  wireToolbars();
  if (!restoreAutosave()) { ed.innerHTML = ''; sampleBlocks().forEach(b => ed.append(b)); dirty = false; }
  applyPrefs();
  refresh();
  updateTitle();
  caretEnd(ed.firstElementChild);
  status('Welcome to LyX!');
  document.addEventListener('selectionchange', () => {
    const s = getSelection(); if (!s.rangeCount) return;
    const r = s.getRangeAt(0);
    if (!ed.contains(r.startContainer)) return;
    savedRange = r.cloneRange();
    if (document.activeElement && document.activeElement.tagName === 'MATH-FIELD') return;
    pendingMath = null;
    setCurrent(currentBlock());
    updateCombo();
  });
  customElements.whenDefined('math-field').then(() => {
    try { if (window.MathfieldElement) { MathfieldElement.soundsDirectory = null; MathfieldElement.plonkSound = null; } } catch (e) {}
    $('#statusRight').dataset.ml = '1';
  });
  setTimeout(() => { if (!customElements.get('math-field')) status('The math editor (MathLive) could not be loaded. Check your internet connection.'); }, 9000);
  window.addEventListener('beforeunload', () => autosave());
}
init();
</script>
